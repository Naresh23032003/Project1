name: lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          git config user.name "Naresh23032003"
          git config user.email "rnaresh23032003r@gmail.com"
          git add package-lock.json
          git commit -m "add package lock"
          git push
